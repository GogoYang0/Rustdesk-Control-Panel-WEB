# CodeRabbit 评审配置：仅 main / develop 为评审目标分支（项目约定 PR 只进入这两个分支，feature 分支经 PR 合入 develop）
# 项目约定：所有 PR 必须经 CodeRabbit 评审并解决其问题后，由维护者人工审核合并
language: zh-CN
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    base_branches:
      - '^main$'
      - '^develop$'
